<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPI LinkX</title>
<style>
:root{--n:#1e2a78;--g:#16a34a;--bg:#f7f8fc;--t:#111827;--m:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:460px;margin:0 auto;padding:16px}
.logo{font-weight:800;font-size:22px;color:var(--n);margin:8px 0 14px}.logo b{color:var(--g)}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px #0001;padding:18px;margin-bottom:14px}
label{display:block;font-size:14px;margin:12px 0 4px;color:var(--m)}
input,select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}
input[readonly]{background:#eef0f6}
button,a.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--n);color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:600;margin-top:14px}
button.alt{background:#fff;color:var(--n);border:1px solid var(--n)}
.wa{background:#25d366}.amt{font-size:36px;font-weight:800;color:var(--n);margin:8px 0}
.m{color:var(--m);font-size:13px}.err{color:#dc2626;font-size:14px;margin-top:8px}
#qr{display:flex;justify-content:center;margin:12px 0}.url{word-break:break-all;font-size:13px;background:#eef0f6;padding:10px;border-radius:10px}
.exp{text-align:center}.exp h2{color:#dc2626}
</style></head><body><main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ====== YAHAN APNI TESTING UPI ID DAALO ======
const CFG={upi:"9552865929@axl",name:"Your Name"};
// =============================================
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
const UPI_RE=/^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/;
const logo='<div class="logo">UPI <b>LinkX</b></div>';
const EXP={"300":"5 minute","3600":"1 ghanta","86400":"24 ghante","604800":"7 din","0":"Lifetime"};

const p=new URLSearchParams(location.search).get("p");
p?payPage(p):createPage();

function createPage(){
 app.innerHTML=logo+`<div class="card">
 <label>UPI ID (fixed)</label><input id="upi" value="${esc(CFG.upi)}" readonly>
 <label>Naam</label><input id="nm" value="${esc(CFG.name)}" readonly>
 <label>Amount ₹ (khali chhodo = payer khud dalega)</label><input id="am" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Jaise 500">
 <label>Note (optional)</label><input id="nt" maxlength="50" placeholder="Jaise Seva / Order #1">
 <label>Link kab tak chale</label><select id="ex">${Object.entries(EXP).map(([k,v])=>`<option value="${k}"${k=="86400"?" selected":""}>${v}</option>`).join("")}</select>
 <div class="err" id="er"></div><button id="go">Link banao</button></div><div id="out"></div>`;
 $("#go").onclick=()=>{
  const upi=$("#upi").value.trim(),am=$("#am").value.trim(),er=$("#er");er.textContent="";
  if(!UPI_RE.test(upi))return er.textContent="UPI ID galat hai (code mein CFG theek karo)";
  if(am&&!(Number(am)>=1&&Number(am)<=100000))return er.textContent="Amount ₹1 se ₹1,00,000 ke beech ho";
  const s=Number($("#ex").value);
  const o={u:upi,n:$("#nm").value.trim(),a:am?Number(Number(am).toFixed(2)):0,t:$("#nt").value.trim(),e:s?Date.now()+s*1000:0};
  const url=location.origin+location.pathname+"?p="+enc(o);
  $("#out").innerHTML=`<div class="card"><b>Link ready ✅</b><div id="qr"></div><div class="url">${esc(url)}</div>
  <button id="cp">Link copy karo</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Payment link: "+url)}">WhatsApp pe bhejo</a>
  <p class="m">${o.e?"Expiry: "+new Date(o.e).toLocaleString():"Lifetime link"}</p></div>`;
  new QRCode($("#qr"),{text:url,width:200,height:200});
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(url);$("#cp").textContent="Copy ho gaya ✓"}catch{prompt("Copy karo:",url)}};
  $("#out").scrollIntoView({behavior:"smooth"});
 };
}

function payPage(raw){
 let o;try{o=dec(raw);if(!UPI_RE.test(o.u))throw 0}catch{app.innerHTML=logo+'<div class="card exp"><h2>Link galat hai</h2></div>';return}
 const expired=()=>o.e&&Date.now()>=o.e;
 if(expired())return expiredView();
 app.innerHTML=logo+`<div class="card"><div class="m">Payment to</div><b>${esc(o.n||o.u)}</b><div class="m">${esc(o.u)}</div>
 ${o.a?`<div class="amt">₹${o.a}</div>`:`<label>Amount ₹ dalo</label><input id="pa" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Amount">`}
 ${o.t?`<div class="m">Note: ${esc(o.t)}</div>`:""}
 <div class="m" id="cd"></div><div class="err" id="er"></div>
 <button id="pay">UPI app se pay karo</button>
 <p class="m">Pay karne ke baad apni UPI app mein status check karo. Yeh site payment confirm nahi karti.</p>
 <button class="alt" id="np">Bina amount ke try karo</button>
 <button class="alt" id="mn">Manual: UPI ID copy karo</button>
 <p class="m" style="margin-top:16px">Agar "declined for security" aaye: dusre phone se ye QR scan karo (UPI app ke Scan se).</p><div id="qr"></div></div>`;
 new QRCode($("#qr"),{text:uri(o,o.a,!!o.a),width:200,height:200});
 $("#np").onclick=()=>{location.href=uri(o,0,false)};
 const tick=()=>{if(expired())return expiredView();if(o.e){const s=Math.floor((o.e-Date.now())/1000);$("#cd").textContent="Link expire hoga: "+Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m "+s%60+"s"}};
 tick();if(o.e)setInterval(tick,1000);
 $("#pay").onclick=()=>{
  if(expired())return expiredView();
  const a=o.a||Number($("#pa").value);
  if(!(a>=1&&a<=100000))return $("#er").textContent="Sahi amount dalo";
  location.href=uri(o,a,true);
  setTimeout(()=>{$("#er").textContent="Agar UPI app nahi khuli to manual UPI ID se pay karo."},2500);
 };
 $("#mn").onclick=async()=>{try{await navigator.clipboard.writeText(o.u);$("#mn").textContent="UPI ID copy ho gayi ✓"}catch{prompt("UPI ID:",o.u)}};
}
function uri(o,a,withAmt){const q=new URLSearchParams({pa:o.u,pn:o.n||o.u});if(withAmt&&a){q.set("am",Number(a).toFixed(2));q.set("cu","INR");if(o.t)q.set("tn",o.t)}return "upi://pay?"+q.toString().replace(/\+/g,"%20")}
function expiredView(){app.innerHTML=logo+'<div class="card exp"><h2>Link expire ho gaya</h2><p>Naya link maango bhejne wale se.</p></div>'}
</script></body></html>
